[project]
name = "gnomepy-testing"
version = "0.2.0"
description = "Testing framework for validating market data implementations"
authors = [
    {name = "mprey",email = "masonprey7@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gnomepy (==2.6.5)",
    "websockets (>=15.0.1,<16.0.0)",
    "sortedcontainers (>=2.4.0,<3.0.0)",
    "jpype1 (>=1.5.0,<2.0.0)",
    "numpy (>=2.2.4,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "cryptography (>=44.0.0,<46.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"

